<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pacientes - LabTrack</title>
    <style>
        /* Un estilo básico y limpio para que no se vea feo mientras desarrollas */
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f7f6; }
        .form-container { background: white; padding: 30px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background-color: #28a745; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; }
        .error-msg { color: red; font-size: 12px; display: none; margin-top: 5px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registro de Nuevo Paciente</h2>
    
    <form id="registroForm" action="/auth/registro" method="POST">
        
        <div class="form-group">
            <label for="cedula">Cédula / DNI:</label>
            <input type="text" id="cedula" name="cedula" required 
                   pattern="[0-9]{10}" maxlength="10" 
                   placeholder="Ej: 1726354712">
            <small id="cedulaError" class="error-msg">La cédula debe tener exactamente 10 dígitos numéricos.</small>
        </div>

        <div class="form-group">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Juan Pérez">
        </div>

        <div class="form-group">
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" required placeholder="juan@ejemplo.com">
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>

        <button type="submit" class="btn">Registrarse</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="/auth/login">Inicia sesión aquí</a></p>
</div>

<script>
    // Validación extra con JavaScript antes de enviar el formulario
    document.getElementById('registroForm').addEventListener('submit', function(e) {
        const cedulaInput = document.getElementById('cedula');
        const errorMsg = document.getElementById('cedulaError');
        
        // Verifica si contiene letras o si no tiene 10 dígitos
        if (!/^\d{10}$/.test(cedulaInput.value)) {
            e.preventDefault(); // Bloquea el envío del formulario
            errorMsg.style.display = 'block';
        } else {
            errorMsg.style.display = 'none';
        }
    });
</script>
</body>
</html>
