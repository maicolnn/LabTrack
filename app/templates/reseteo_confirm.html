<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - LabTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <script defer src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="bi bi-key"></i>
                </div>
                <h1 class="auth-title">Restablecer Contraseña</h1>
                <p class="auth-subtitle">Ingresa una nueva contraseña</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="alerts-container">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category if category != 'error' else 'danger' }}">
                                <i class="bi bi-info-circle-fill" style="margin-right: 8px;"></i>
                                <span>{{ message }}</span>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.reset_with_token', token=token) }}" method="POST">
                <div class="form-group">
                    <label class="form-label" for="password">Nueva Contraseña</label>
                    <input type="password" name="password" id="password" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password2">Confirmar Contraseña</label>
                    <input type="password" name="password2" id="password2" class="form-input" required>
                </div>

                <div class="modal-footer" style="justify-content: flex-start;">
                    <button type="submit" class="btn-primary">Restablecer</button>
                    <a href="{{ url_for('auth.login') }}" class="btn-secondary" style="margin-left:8px; text-decoration:none; display:inline-block; padding:10px 16px;">Cancelar</a>
                </div>
            </form>

        </div>
    </div>
</body>
</html>
