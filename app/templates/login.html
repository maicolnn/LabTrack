<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LabTrack</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilo Premium -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="bi bi-activity"></i>
                </div>
                <h1 class="auth-title">LabTrack</h1>
                <p class="auth-subtitle">Ingresa al control del laboratorio clínico</p>
            </div>

            <!-- Contenedor de Mensajes Flash -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="alerts-container">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category if category != 'error' else 'danger' }}">
                                <i class="bi bi-info-circle-fill" style="margin-right: 8px;"></i>
                                <span>{{ message }}</span>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.login') }}" method="POST" id="loginForm">
                <div class="form-group">
                    <label for="correo" class="form-label">Correo Electrónico</label>
                    <div class="input-container">
                        <input type="email" name="correo" id="correo" class="form-input" placeholder="nombre@correo.com" required>
                        <i class="bi bi-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-container">
                        <input type="password" name="password" id="password" class="form-input" placeholder="••••••••" required>
                        <i class="bi bi-lock input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="auth-btn">
                    <span>Ingresar</span>
                    <i class="bi bi-box-arrow-in-right"></i>
                </button>
            </form>

            <div class="auth-actions">
                <a href="{{ url_for('auth.reseteo') }}" class="auth-link">¿Olvidaste tu contraseña?</a>
            </div>

            <div class="auth-text-center">
                <span>¿No tienes una cuenta?</span>
                <a href="{{ url_for('auth.registro') }}" class="auth-link">Regístrate aquí</a>
            </div>
        </div>
    </div>
</body>
</html>
