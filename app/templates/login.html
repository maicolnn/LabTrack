<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LabTrack</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <div class="inline-flex p-3 bg-blue-50 text-blue-600 rounded-full mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v1.244c0 .894-.493 1.713-1.272 2.138A7.502 7.502 0 0 0 5.25 13.5m10.5-10.396v1.244c0 .894.493 1.713 1.272 2.138a7.502 7.502 0 0 1 3.228 6.513m-3.75 1.5H9.75m0 0a3 3 0 0 1-3-3V12m3 3a3 3 0 0 0 3 3h3.008a3 3 0 0 0 3-3V12m-6 3V12m6 3V12" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">LabTrack Monolito</h2>
            <p class="text-sm text-slate-500 mt-1">Plataforma de Gestión y Resultados Clínicos</p>
        </div>

        <form action="/auth/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Correo Electrónico</label>
                <input type="email" name="correo" required 
                       class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                       placeholder="ejemplo@correo.com">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-sm font-semibold text-slate-700">Contraseña</label>
                    <a href="/auth/reseteo" class="text-xs font-medium text-blue-600 hover:underline">¿Olvidaste tu clave?</a>
                </div>
                <input type="password" name="password" required 
                       class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                       placeholder="••••••••">
            </div>

            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm cursor-pointer mt-2">
                Ingresar al Sistema
            </button>
        </form>

        <div class="text-center mt-6 pt-5 border-t border-slate-100">
            <p class="text-sm text-slate-600">
                ¿No tienes una cuenta de paciente? 
                <a href="/auth/registro" class="font-semibold text-blue-600 hover:underline ml-1">Regístrate aquí</a>
            </p>
        </div>
    </div>

</body>
</html>
